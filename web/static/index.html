<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Questionnaire</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <p class="eyebrow">Questionnaire</p>
      <h1 id="title">Loading…</h1>
      <p id="submitter" class="submitter" hidden></p>
      <p id="subtitle" class="subtitle"></p>
    </header>

    <div id="notice" class="notice" role="status" hidden></div>

    <form id="start" class="card start" hidden>
      <label for="start-puid">Product ID (PUID)</label>
      <div class="start-row">
        <input id="start-puid" name="puid" required autocomplete="off" spellcheck="false">
        <button type="submit" class="primary">Open</button>
      </div>
    </form>

    <form id="questionnaire" hidden>
      <ol id="questions" class="questions"></ol>
      <div class="actions">
        <span id="save-state" class="save-state" aria-live="polite"></span>
        <button id="save" type="submit" class="primary">Save</button>
      </div>
    </form>

    <details id="history" class="history" hidden>
      <summary>Version history</summary>
      <ol id="history-list"></ol>
    </details>
  </main>
</body>
</html>
